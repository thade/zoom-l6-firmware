# Publishes the browser patcher (patcher/) to GitHub Pages:
# https://thade.github.io/zoom-l6-firmware/
name: Patcher on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['patcher/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: patcher
      - id: deployment
        uses: actions/deploy-pages@v5
